<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>詩のガチャ｜わたしの幽霊</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hina+Mincho&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111;--g1:#555;--g2:#999;--g3:#bbb;--rule:#e0e0e0}
@media (prefers-color-scheme:dark){:root{--bg:#111;--ink:#fff;--g1:#aaa;--g2:#666;--g3:#444;--rule:#2a2a2a}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:"Hina Mincho",serif;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;
  padding:calc(env(safe-area-inset-top) + 40px) 20px calc(env(safe-area-inset-bottom) + 32px)}
header{flex:none;text-align:center}
h1{margin:0;font-weight:400;font-size:28px;line-height:1.3;letter-spacing:.42em;padding-left:.42em}
.circle{margin-top:14px;font-size:11px;color:var(--g2);letter-spacing:.45em;padding-left:.45em}
.machine{flex:1;min-height:0;width:100%;max-width:282px;display:flex;flex-direction:column;margin-top:24px}
.feed{flex:1;min-height:0;position:relative;overflow:hidden;margin:0 21px -12px;touch-action:none}
.sheet{position:absolute;left:0;right:0;top:0;background:var(--bg);border:1px solid var(--rule);border-bottom:0;
  padding:24px 16px 32px;transition:transform .3s ease;will-change:transform}
.sheet.out{transition:transform .5s ease-in}
.poem{font-size:14px;line-height:2;letter-spacing:.12em}
.line{min-height:2em;word-break:keep-all;overflow-wrap:anywhere;line-break:strict}
.c{visibility:hidden}.c.on{visibility:visible}
.credit{margin-top:1.6em;text-align:right;font-size:11px;line-height:2;color:var(--g1);letter-spacing:.3em}
/* プラテン：カプセル＋両端の丸 */
.platen{position:relative;z-index:1;flex:none;height:25px;margin:0 8px;border:1px solid var(--ink);border-radius:12.5px;background:var(--bg)}
.platen::before,.platen::after{content:"";position:absolute;top:50%;width:16px;height:16px;margin-top:-8px;
  border:1px solid var(--ink);border-radius:50%;background:var(--bg)}
.platen::before{left:-8px}.platen::after{right:-8px}
.body{flex:none}
.body svg{display:block;width:100%;height:auto;overflow:visible}
.key{fill:var(--bg);stroke:var(--ink);stroke-width:1}
.kana{fill:var(--g1);font-family:"Hina Mincho",serif;font-size:8px;text-anchor:middle;dominant-baseline:central}
.ink-line{fill:none;stroke:var(--ink);stroke-width:1}
.pull{flex:none;margin-top:23px;min-width:125px;height:45px;padding:0 18px 0 calc(18px + .4em);
  border:1px solid var(--ink);border-radius:0;background:var(--bg);color:var(--ink);
  font:inherit;font-size:13px;letter-spacing:.4em;cursor:pointer;transition:transform .08s,opacity .2s}
.pull:active{transform:translateY(2px)}
.pull:disabled{opacity:.35;cursor:default}
.pull:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
@media (prefers-reduced-motion:reduce){.sheet,.sheet.out{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>詩のガチャ</h1>
    <div class="circle">わたしの幽霊</div>
  </header>
  <div class="machine">
    <div class="feed" id="feed" aria-live="polite"></div>
    <div class="platen" aria-hidden="true"></div>
    <div class="body">
      <svg viewBox="0 0 282 140" aria-hidden="true">
        <g id="keys"></g>
        <rect class="ink-line" x="67.7" y="108.4" width="146.6" height="11.3" rx="5.65"/>
        <path class="ink-line" d="M1.7 131 V138 H280.3 V131"/>
      </svg>
    </div>
  </div>
  <button class="pull" id="draw" type="button" disabled>ガチャを引く</button>
</div>
<script>
const POEMS_URL = 'poems.txt'; // 同じフォルダの詩ファイル（空行区切り）
const CREDIT = '花野わかれ';

// キー（線画・かな）
(() => {
  const g = document.getElementById('keys'), ns = 'http://www.w3.org/2000/svg';
  const kana = 'あいうえおかきくけこさしすせそたちつてとなにぬね';
  for (let r = 0; r < 3; r++) for (let i = 0; i < 8; i++) {
    const cx = 39 + i * 29, cy = 28 + r * 29;
    const c = document.createElementNS(ns, 'circle');
    c.setAttribute('class', 'key'); c.setAttribute('cx', cx); c.setAttribute('cy', cy); c.setAttribute('r', 11.3);
    const t = document.createElementNS(ns, 'text');
    t.setAttribute('class', 'kana'); t.setAttribute('x', cx); t.setAttribute('y', cy);
    t.textContent = kana[r * 8 + i];
    g.append(c, t);
  }
})();

const GAP = 10;
const IDLE = 42; // 待機中に見える紙の高さ（プラテンに隠れる分を含む）
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const feed = document.getElementById('feed');
const btn = document.getElementById('draw');
const sleep = ms => new Promise(r => setTimeout(r, ms));
let poems = [], deck = [], last = -1;
let sheet = null, y = 0, minY = 0, lastStep = null, typing = false, skipReq = false;

function parse(t) {
  return t.replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n')
    .split(/\n[ \t\u3000]*\n/)
    .map(b => b.replace(/^(?:[ \t\u3000]*\n)+/, '').replace(/\s+$/, ''))
    .filter(b => b.trim());
}

function draw() {
  if (!deck.length) {
    deck = poems.map((_, i) => i);
    for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
    const e = deck.length - 1;
    if (e > 0 && deck[e] === last) [deck[0], deck[e]] = [deck[e], deck[0]];
  }
  last = deck.pop();
  return poems[last];
}

// 折り返し位置：語の切れ目（簡易な文節まとめ）
const SEG = Intl.Segmenter ? new Intl.Segmenter('ja', { granularity: 'word' }) : null;
const HEAD = /[\p{Script=Han}\p{Script=Katakana}A-Za-z0-9０-９Ａ-Ｚａ-ｚ々〆ヶ]/u;
const HIRA = /^[\p{Script=Hiragana}ー]+$/u;
const OPEN = /[「『（(〈《【［\[]/;
const NO_BEFORE = /^[、。，．・：；？！!?」』）)〉》】］\]ーぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮヵヶ…‥〜～]/u;
function chunks(line) {
  if (!SEG) return [line];
  const out = []; let cur = '';
  for (const { segment: s } of SEG.segment(line)) {
    if (!cur) { cur = s; continue; }
    const p = cur.slice(-1);
    let brk = false;
    if (/\s/.test(s[0]) || NO_BEFORE.test(s) || OPEN.test(p)) brk = false;
    else if (/\s/.test(p)) brk = true;
    else if (OPEN.test(s[0])) brk = true;
    else if (HEAD.test(s[0]) && !HEAD.test(p)) brk = true;
    else if (HIRA.test(s) && s.length >= 3 && /\p{Script=Hiragana}/u.test(p)) brk = true;
    if (brk) { out.push(cur); cur = s; } else cur += s;
  }
  if (cur) out.push(cur);
  return out;
}

function addChars(parent, text, steps) {
  for (const c of text) {
    const sp = document.createElement('span');
    sp.className = 'c'; sp.textContent = c;
    parent.appendChild(sp); steps.push({ el: sp, pause: 0 });
  }
}

function build(text) {
  const s = document.createElement('div'); s.className = 'sheet';
  const p = document.createElement('div'); p.className = 'poem'; s.appendChild(p);
  const steps = [];
  for (const line of text.split('\n')) {
    const ld = document.createElement('div'); ld.className = 'line'; p.appendChild(ld);
    if (!line.trim()) { steps.push({ line: ld, pause: 420 }); continue; }
    chunks(line).forEach((ch, k) => {
      if (k) ld.appendChild(document.createElement('wbr'));
      addChars(ld, ch, steps);
    });
    steps[steps.length - 1].pause = 300;
  }
  steps[steps.length - 1].pause = 700;
  const cr = document.createElement('div'); cr.className = 'credit'; s.appendChild(cr);
  addChars(cr, CREDIT, steps);
  return { s, steps };
}

function bottomOf(st) {
  if (st.line) return st.line.offsetTop + st.line.offsetHeight;
  const el = st.el, lh = parseFloat(getComputedStyle(el.parentNode).lineHeight) || el.offsetHeight;
  return el.offsetTop + (el.offsetHeight + lh) / 2;
}

function setY(v, anim = true) {
  y = v;
  sheet.style.transition = (anim && !reduce) ? '' : 'none';
  sheet.style.transform = `translateY(${v}px)`;
}
function feedTo(b, anim = true) { setY(feed.clientHeight - b - GAP, anim); }
function clampY(v) { return Math.min(Math.max(v, minY), Math.max(minY, 0)); }

function eject() {
  if (!sheet) return;
  const old = sheet;
  old.classList.add('out'); old.style.transition = '';
  old.style.transform = `translateY(${-(old.offsetHeight + 40)}px)`;
  setTimeout(() => old.remove(), reduce ? 0 : 520);
}

async function play() {
  if (typing || !poems.length) return;
  typing = true; skipReq = false; btn.disabled = true;
  const first = !lastStep; // 待機中の紙にそのまま打つ（排出しない）
  if (first) sheet.remove(); else { eject(); await sleep(reduce ? 0 : 380); }
  const { s, steps } = build(draw());
  feed.appendChild(s); sheet = s;
  if (first) {
    setY(feed.clientHeight - IDLE, false); void s.offsetHeight;
    await sleep(reduce ? 0 : 150);
  } else {
    setY(feed.clientHeight, false); void s.offsetHeight;
    setY(feed.clientHeight - IDLE);
    await sleep(reduce ? 0 : 450);
  }
  let curB = -1;
  for (const st of steps) {
    if (skipReq || reduce) break;
    if (st.el) st.el.classList.add('on');
    const b = bottomOf(st);
    if (b !== curB) { curB = b; feedTo(b); }
    if (st.el) await sleep(55 + Math.random() * 45);
    if (st.pause) await sleep(st.pause);
  }
  steps.forEach(st => st.el && st.el.classList.add('on'));
  lastStep = steps[steps.length - 1];
  feedTo(bottomOf(lastStep));
  minY = y;
  typing = false; btn.disabled = false;
}

// 待機中：白紙が少しだけ出ている状態
function showBlank() {
  const s = document.createElement('div'); s.className = 'sheet';
  s.style.height = '200px';
  feed.appendChild(s); sheet = s;
  setY(feed.clientHeight - IDLE, false);
  minY = y;
}

// 打鍵中のタップで最後まで表示／打ち終わったら紙を上下にずらして読める
let drag = null;
feed.addEventListener('pointerdown', e => { drag = { y0: e.clientY, start: y, moved: false }; feed.setPointerCapture(e.pointerId); });
feed.addEventListener('pointermove', e => {
  if (!drag || typing || !sheet || !lastStep) return;
  const dy = e.clientY - drag.y0;
  if (Math.abs(dy) > 4) drag.moved = true;
  if (drag.moved) setY(clampY(drag.start + dy), false);
});
feed.addEventListener('pointerup', () => { if (drag && !drag.moved && typing) skipReq = true; drag = null; });
feed.addEventListener('pointercancel', () => { drag = null; });
feed.addEventListener('wheel', e => { if (typing || !sheet || !lastStep) return; e.preventDefault(); setY(clampY(y - e.deltaY), false); }, { passive: false });
addEventListener('resize', () => {
  if (!sheet || typing) return;
  minY = lastStep ? feed.clientHeight - bottomOf(lastStep) - GAP : feed.clientHeight - IDLE;
  setY(minY, false);
});
btn.addEventListener('click', play);

(async () => {
  let txt = null;
  {
    try {
      const r = await fetch(POEMS_URL, { cache: 'no-cache' });
      const ct = r.headers.get('content-type') || '';
      if (r.ok && !ct.includes('html')) txt = await r.text();
    } catch (e) {}
  }
  poems = txt ? parse(txt) : [];
  showBlank();
  if (!poems.length) { btn.textContent = '詩を読み込めませんでした'; return; }
  try { await Promise.race([document.fonts.load('14px "Hina Mincho"'), sleep(2500)]); } catch (e) {}
  btn.disabled = false;
})();
</script>
</body>
</html>
